<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة نشر المانجا والويبتون العصرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19; /* أسود داكن مائل للأزرق */
        }
        .text-accent { color: #06b6d4; } /* أخضر مائل للأزرق Cyan */
        .bg-accent { background-color: #06b6d4; }
        .border-accent { border-color: #06b6d4; }
        .hover-accent:hover { color: #22d3ee; }
        /* إخفاء شريط التمرير الافتراضي لشكل أكثر أناقة */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0b0f19; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    </style>
</head>
<body class="text-gray-200 font-sans min-h-screen flex flex-col">

    <nav class="bg-[#111827] border-b border-gray-800 sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            
            <div class="flex items-center">
                <img src="eagle.PNG" alt="لوغو الموقع" class="h-16 w-auto object-contain" onerror="this.style.display='none'; document.getElementById('logo-text').style.display='block';">
                <span id="logo-text" class="hidden text-2xl font-black tracking-wider text-accent">EAGLE<span class="text-white">MANGA</span></span>
            </div>

            <div id="main-nav-links" class="hidden md:flex items-center space-x-reverse space-x-6 font-medium">
                <button onclick="showSection('home-section')" class="nav-btn text-accent border-b-2 border-accent pb-1">الرئيسية</button>
                <button onclick="showSection('home-section')" class="nav-btn hover-accent transition">قائمة المانجا</button>
                <button onclick="toggleAdminPanel()" class="opacity-10 hover:opacity-100 text-xs transition px-2 py-1 border border-gray-700 rounded mr-4">لوحة التحكم</button>
            </div>

            <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white">
                <i class="fa-solid fa-bars text-2xl"></i>
            </button>
        </div>

        <div id="mobile-menu" class="hidden md:hidden mt-3 space-y-2 px-2 pb-3 pt-2 bg-[#1f2937] rounded-lg">
            <button onclick="showSection('home-section'); toggleMobileMenu();" class="block w-full text-right px-3 py-2 rounded-md bg-gray-900 text-accent">الرئيسية</button>
            <button onclick="toggleAdminPanel(); toggleMobileMenu();" class="block w-full text-right px-3 py-2 rounded-md text-xs text-gray-500">لوحة التحكم السرية</button>
        </div>
    </nav>

    <div id="admin-panel" class="hidden bg-[#1f2937] border-b border-cyan-900 text-white p-6 shadow-inner transition-all">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-accent"><i class="fa-solid fa-user-shield ml-2"></i>لوحة تحكم الناشر لتنزيل المانجا والويبتون</h3>
                <button onclick="toggleAdminPanel()" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form id="add-manga-form" class="space-y-4" onsubmit="addNewManga(event)">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="manga-title" placeholder="اسم المانجا / الويبتون" required class="bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
                    <input type="text" id="manga-chapter" placeholder="رقم الفصل (مثال: الفصل 01)" required class="bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
                    <input type="text" id="manga-genres" placeholder="التصنيفات (مثال: أكشن، مغامرة، سحر)" required class="bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="url" id="manga-cover" placeholder="رابط صورة الغلاف الرئيسي" required class="bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500">
                    <span class="text-xs text-gray-400 flex items-center">ملاحظة: يمكنك رفع الصور في أي موقع رفع صور ووضع روابطها هنا.</span>
                </div>

                <div>
                    <textarea id="manga-summary" rows="2" placeholder="قصة المانجا أو نبذة مختصرة عنها..." required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:outline-none focus:border-cyan-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm text-gray-400 mb-1">روابط صور الفصل (العرض العمودي المتتالي للويبتون):</label>
                    <textarea id="manga-pages" rows="4" placeholder="ضع روابط الصور هنا.. ضع رابط كل صورة في سطر جديد أو افصل بينها بفاصلة (,)" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white font-mono text-sm focus:outline-none focus:border-cyan-500"></textarea>
                </div>

                <div class="text-left">
                    <button type="submit" class="bg-accent text-gray-900 font-bold px-8 py-2 rounded hover:bg-cyan-400 transition shadow-lg">نشر الفصل والقصة فوراً</button>
                </div>
            </form>
        </div>
    </div>

    <main id="home-section" class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-8 border-r-4 border-accent pr-3">
            <h2 class="text-2xl font-extrabold text-white">الفصول والقصص الحالية</h2>
            <span class="text-xs bg-gray-800 text-accent px-3 py-1 rounded-full border border-cyan-900">تحديث مستمر</span>
        </div>

        <div id="manga-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            </div>
    </main>

    <main id="reader-section" class="hidden flex-grow w-full mx-auto py-6 bg-[#070a12]">
        <div class="max-w-3xl mx-auto px-4">
            
            <div class="flex flex-col md:flex-row justify-between items-center bg-[#111827] p-4 rounded-xl border border-gray-800 mb-6 gap-4">
                <div>
                    <h2 id="reader-title" class="text-xl font-bold text-white">اسم المانجا</h2>
                    <p id="reader-chapter" class="text-sm text-accent">الفصل 01</p>
                </div>
                <div class="flex items-center space-x-reverse space-x-2">
                    <button onclick="showSection('home-section')" class="bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded transition text-sm">
                        <i class="fa-solid fa-house ml-2"></i>الرئيسية
                    </button>
                </div>
            </div>

            <div class="bg-[#111827] p-4 rounded-xl border border-gray-800 mb-8">
                <div class="flex flex-wrap gap-2 mb-3" id="reader-genres">
                    </div>
                <p class="text-sm text-gray-400 leading-relaxed font-light" id="reader-summary">قصة المانجا تفاصيل...</p>
            </div>

            <div id="webtoon-images-container" class="flex flex-col items-center bg-black rounded-lg overflow-hidden border border-gray-900 shadow-2xl">
                </div>

            <div class="text-center mt-8">
                <button onclick="showSection('home-section')" class="bg-accent text-gray-900 font-bold px-8 py-3 rounded-full hover:bg-cyan-400 transition shadow-lg">
                    العودة للرئيسية وإنهاء القراءة
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-[#090d16] border-t border-gray-900 py-6 text-center text-sm text-gray-500 mt-auto">
        <p>جميع الحقوق محفوظة © 2026 | منصة EAGLE MANGA للويبتون</p>
    </footer>

    <script>
        // مصفوفة افتراضية لبيانات المانجا لحين قيامك بنشر فصولك الخاصة
        let mangaList = JSON.parse(localStorage.getItem('manga_data')) || [
            {
                id: 1,
                title: "مغامرة فتى النسيم",
                chapter: "الفصل 01",
                genres: "أكشن, مغامرة, شونين",
                cover: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=400",
                summary: "تدور القصة حول فتى يكتشف قدرة غامضة للتحكم بالرياح ويسعى لحماية قريته من قوى الظلام العائدة من الماضي السحيق.",
                pages: [
                    "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=600",
                    "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?q=80&w=600"
                ]
            }
        ];

        // دالة تبديل الأقسام (رئيسية / قارئ المانجا)
        function showSection(sectionId) {
            document.getElementById('home-section').classList.add('hidden');
            document.getElementById('reader-section').classList.add('hidden');
            document.getElementById(sectionId).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        }

        function toggleAdminPanel() {
            document.getElementById('admin-panel').classList.toggle('hidden');
        }

        // دالة عرض وتحديث قائمة المانجا بالرئيسية
        function renderMangaCards() {
            const container = document.getElementById('manga-container');
            container.innerHTML = '';

            mangaList.forEach((manga, index) => {
                const card = document.createElement('div');
                card.className = "bg-[#111827] rounded-lg overflow-hidden border border-gray-800 shadow-md hover:border-cyan-500 transition duration-300 group cursor-pointer";
                card.onclick = () => openMangaReader(index);
                
                card.innerHTML = `
                    <div class="relative overflow-hidden aspect-[3/4]">
                        <img src="${manga.cover}" alt="${manga.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        <span class="absolute top-2 right-2 bg-accent text-gray-900 text-xs font-bold px-2 py-1 rounded">WEBTOON</span>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-white truncate group-hover:text-accent transition">${manga.title}</h3>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-sm text-gray-400">${manga.chapter}</span>
                            <span class="text-xs text-gray-500"><i class="fa-solid fa-eye ml-1"></i>قراءة</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // دالة فتح وضع القراءة الطولي للويبتون
        function openMangaReader(index) {
            const manga = mangaList[index];
            
            document.getElementById('reader-title').innerText = manga.title;
            document.getElementById('reader-chapter').innerText = manga.chapter;
            document.getElementById('reader-summary').innerText = manga.summary;

            // توليد التصنيفات كأزرار ملونة
            const genresContainer = document.getElementById('reader-genres');
            genresContainer.innerHTML = '';
            manga.genres.split(',').forEach(genre => {
                genresContainer.innerHTML += `<span class="bg-cyan-950 text-accent border border-cyan-800 text-xs px-2 py-1 rounded">${genre.trim()}</span>`;
            });

            // توليد الصور عمودياً تحت بعض بدون فراغات (نظام ويبتون)
            const imagesContainer = document.getElementById('webtoon-images-container');
            imagesContainer.innerHTML = '';
            
            manga.pages.forEach(pageUrl => {
                if(pageUrl.trim() !== "") {
                    const img = document.createElement('img');
                    img.src = pageUrl.trim();
                    img.className = "w-full h-auto block object-contain border-b border-gray-900";
                    img.alt = "صفحة الويبتون";
                    imagesContainer.appendChild(img);
                }
            });

            showSection('reader-section');
        }

        // دالة استقبال البيانات من لوحة التحكم وإضافتها
        function addNewManga(event) {
            event.preventDefault();

            const title = document.getElementById('manga-title').value;
            const chapter = document.getElementById('manga-chapter').value;
            const genres = document.getElementById('manga-genres').value;
            const cover = document.getElementById('manga-cover').value;
            const summary = document.getElementById('manga-summary').value;
            const pagesRaw = document.getElementById('manga-pages').value;

            // تحويل النص المدخل لصور الفصل إلى مصفوفة روابط حقيقية (عبر الفصل بأسطر أو فواصل)
            const pagesArray = pagesRaw.split(/[\n,]+/).map(url => url.trim()).filter(url => url !== "");

            const newManga = {
                id: Date.now(),
                title: title,
                chapter: chapter,
                genres: genres,
                cover: cover,
                summary: summary,
                pages: pagesArray
            };

            // إدخال في بداية المصفوفة لحفظ الترتيب الأحدث أولاً
            mangaList.unshift(newManga);

            // الحفظ الدائم في المتصفح
            localStorage.setItem('manga_data', JSON.stringify(mangaList));

            // إعادة عرض الصفحة وتصفير المدخلات وإغلاق اللوحة
            renderMangaCards();
            document.getElementById('add-manga-form').reset();
            toggleAdminPanel();
            
            alert('تم نشر الفصل وقصة المانجا بنجاح، وتهيئتها بنظام العرض العمودي للويبتون!');
        }

        // تشغيل البناء الأولي للموقع عند الفتح
        window.onload = renderMangaCards;
    </script>
</body>
</html>
